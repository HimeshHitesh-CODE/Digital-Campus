<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./screens/01-auth/login.html" />
  <title>Samskruti Digital Campus | Redirecting...</title>
  <script type="module">
    import { api } from './js/api.js';
    import { redirectToDefaultPortal } from './js/auth-guard.js';

    const token = api.getToken();
    const user = api.getUser();

    if (token && user && user.role) {
      redirectToDefaultPortal(user.role);
    } else {
      window.location.replace('./screens/01-auth/login.html');
    }
  </script>
</head>
<body style="background: #E8ECF2; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; color: #4A5568;">
  <div style="text-align: center;">
    <h2>Samskruti College of Engineering & Technology (Code: 259)</h2>
    <p style="margin-top: 8px; color: #718096;">Redirecting to Digital Campus Portal...</p>
  </div>
</body>
</html>
