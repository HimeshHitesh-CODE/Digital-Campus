<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Marketplace | Samskruti College (Code: 259)</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Master Design System Stylesheets -->
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/theme-tokens.css" />
  <link rel="stylesheet" href="../../css/dc-global-theme.css?v=3.3.0" />
  <link rel="stylesheet" href="../../css/top-nav.css?v=3.3.0" />
  <link rel="stylesheet" href="./marketplace.css" />

  <!-- Global Dynamic Island & Navigation Engine -->
  <script src="../../js/dc-dynamic-island.js?v=3.3.0"></script>

  <style>
    .market-page-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 0 60px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .top-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .top-bar-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-heading);
      letter-spacing: -0.02em;
      margin: 0;
    }

    .top-bar-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .btn-create-listing {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      transition: all 0.25s ease;
    }

    .btn-create-listing:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(16, 185, 129, 0.45);
    }

    .category-pills {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .cat-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      background: var(--surface-card);
      border: 1px solid var(--border-card);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-pill-btn:hover,
    .cat-pill-btn.active {
      background: var(--brand-primary-tint);
      color: var(--brand-primary);
      border-color: var(--brand-accent);
      font-weight: 700;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    .product-card {
      background: var(--surface-card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border-card);
      outline: 1px solid var(--border-card-outer);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg), 0 0 20px rgba(16, 185, 129, 0.20);
      border-color: var(--brand-accent);
    }

    .product-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-category-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--brand-primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--brand-primary-tint);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    .product-price-tag {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--brand-accent);
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-heading);
      margin: 0;
      line-height: 1.35;
    }

    .product-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin: 0;
      flex: 1;
    }

    .product-seller-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-top: 10px;
      border-top: 1px solid var(--border-divider);
    }

    .btn-contact-seller {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 14px;
      border-radius: var(--radius-pill);
      background: var(--surface-raised);
      border: 1px solid var(--border-card);
      color: var(--brand-primary);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-contact-seller:hover {
      background: var(--brand-primary);
      color: #ffffff;
      border-color: var(--brand-primary);
    }
  
    /* Marketplace Frosted Glass Modals */
    .market-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(2, 14, 9, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }

    .market-modal-card {
      background: var(--surface-card, rgba(14, 40, 28, 0.9));
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border-card, rgba(110, 231, 183, 0.3));
      outline: 1px solid var(--border-card-outer, rgba(255, 255, 255, 0.08));
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 540px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .market-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-divider, rgba(110, 231, 183, 0.15));
      padding-bottom: 14px;
    }

    .market-modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-heading, #f0fdf4);
      margin: 0;
    }

    .market-modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted, #a7d9be);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .market-modal-close:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .market-form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .market-form-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-heading, #f0fdf4);
      letter-spacing: 0.02em;
    }

    .market-form-input,
    .market-form-select,
    .market-form-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--surface-raised, rgba(20, 52, 36, 0.6));
      border: 1px solid var(--border-card, rgba(110, 231, 183, 0.25));
      color: var(--text-main, #f0fdf4);
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    .market-form-input:focus,
    .market-form-select:focus,
    .market-form-textarea:focus {
      border-color: var(--brand-accent, #34d399);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .market-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .market-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--border-divider, rgba(110, 231, 183, 0.15));
      padding-top: 14px;
      margin-top: 6px;
    }

    .btn-modal-cancel {
      padding: 9px 18px;
      border-radius: 9999px;
      background: transparent;
      border: 1px solid var(--border-card, rgba(110, 231, 183, 0.25));
      color: var(--text-muted, #a7d9be);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-modal-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .btn-modal-submit {
      padding: 9px 24px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
      transition: all 0.2s;
    }

    .btn-modal-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .product-actions-bar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-edit-listing {
      flex: 1;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fbbf24;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-edit-listing:hover {
      background: rgba(251, 191, 36, 0.3);
      color: #fef08a;
    }

    .btn-delete-listing {
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-delete-listing:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

  </style>
</head>
<body class="student-portal-body">

  <div class="portal-viewport-wrapper">
    <main class="main-content">
      <div class="market-page-container">

        <!-- Top Title Bar -->
        <header class="top-bar-header">
          <div>
            <h1 class="top-bar-title">Student Marketplace &amp; Exchange</h1>
            <p class="top-bar-sub" id="market-subtitle">Samskruti College (Code: 259) • Verified Peer-to-Peer Academic Exchange</p>
          </div>
          <div>
            <button type="button" class="btn-create-listing" id="btn-list-item">
              <i data-lucide="plus-circle" style="width: 17px; height: 17px;"></i>
              <span>Sell an Item</span>
            </button>
          </div>
        </header>

        <!-- Category Filters -->
        <div class="category-pills" id="categoryFilterBar">
          <button class="cat-pill-btn active" data-category="ALL">All Surplus</button>
          <button class="cat-pill-btn" data-category="TEXTBOOK">📚 Textbooks &amp; Notes</button>
          <button class="cat-pill-btn" data-category="DRAFTER">📐 Mini Drafters &amp; Kits</button>
          <button class="cat-pill-btn" data-category="CALCULATOR">🔢 Calculators</button>
          <button class="cat-pill-btn" data-category="LAB_COAT">🥼 Lab Coats &amp; Aprons</button>
          <button class="cat-pill-btn" data-category="ELECTRONICS">⚡ Dev Boards &amp; Arduinos</button>
        </div>

        <!-- Products Grid Container -->
        <div class="product-grid" id="productGridContainer">
          <!-- Dynamically populated via marketplace.js -->
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="./marketplace.js"></script>

  <!-- =========================================================================
       MODAL 1: SELL AN ITEM MODAL
       ========================================================================= -->
  <div class="market-modal-overlay" id="list-item-modal">
    <div class="market-modal-card">
      <div class="market-modal-header">
        <h3 class="market-modal-title">Sell an Item on Campus</h3>
        <button type="button" class="market-modal-close" id="close-list-modal">&times;</button>
      </div>

      <form id="form-list-item">
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div class="market-form-group">
            <label class="market-form-label" for="item-title">Item Title / Book Name *</label>
            <input type="text" id="item-title" class="market-form-input" placeholder="e.g., Higher Eng. Mathematics (B.S. Grewal 44th Ed.)" required />
          </div>

          <div class="market-form-row">
            <div class="market-form-group">
              <label class="market-form-label" for="item-category">Category *</label>
              <select id="item-category" class="market-form-select" required>
                <option value="TEXTBOOK">📚 Textbooks & Notes</option>
                <option value="DRAFTER">📐 Mini Drafters & Kits</option>
                <option value="CALCULATOR">🔢 Calculators</option>
                <option value="LAB_COAT">🥼 Lab Coats & Aprons</option>
                <option value="ELECTRONICS">⚡ Dev Boards & Electronics</option>
                <option value="OTHER">📦 Other Academic Gear</option>
              </select>
            </div>

            <div class="market-form-group">
              <label class="market-form-label" for="item-price">Price (₹ INR) *</label>
              <input type="number" id="item-price" class="market-form-input" placeholder="e.g., 350" min="0" step="10" required />
            </div>
          </div>

          <div class="market-form-row">
            <div class="market-form-group">
              <label class="market-form-label" for="item-condition">Condition *</label>
              <select id="item-condition" class="market-form-select" required>
                <option value="Brand New">Brand New (Unopened)</option>
                <option value="Like New" selected>Like New (No Markings)</option>
                <option value="Good Condition">Good Condition (Usable)</option>
                <option value="Fair Condition">Fair Condition</option>
              </select>
            </div>

            <div class="market-form-group">
              <label class="market-form-label" for="item-contact">Campus Pickup Spot</label>
              <input type="text" id="item-contact" class="market-form-input" placeholder="e.g., C-Block Library / Canteen" />
            </div>
          </div>

          <div class="market-form-group">
            <label class="market-form-label" for="item-description">Item Description & Details</label>
            <textarea id="item-description" class="market-form-textarea" rows="3" placeholder="Describe the item condition, edition, included accessories, or pickup time..."></textarea>
          </div>
        </div>

        <div class="market-modal-footer">
          <button type="button" class="btn-modal-cancel" id="cancel-list-modal">Cancel</button>
          <button type="submit" class="btn-modal-submit" id="btn-submit-listing">Publish Listing ✨</button>
        </div>
      </form>
    </div>
  </div>

  <!-- =========================================================================
       MODAL 2: EDIT / UPDATE LISTING MODAL
       ========================================================================= -->
  <div class="market-modal-overlay" id="edit-item-modal">
    <div class="market-modal-card">
      <div class="market-modal-header">
        <h3 class="market-modal-title">Update Product Listing</h3>
        <button type="button" class="market-modal-close" id="close-edit-modal">&times;</button>
      </div>

      <form id="form-edit-item">
        <input type="hidden" id="edit-item-id" />
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div class="market-form-group">
            <label class="market-form-label" for="edit-item-title">Item Title *</label>
            <input type="text" id="edit-item-title" class="market-form-input" required />
          </div>

          <div class="market-form-row">
            <div class="market-form-group">
              <label class="market-form-label" for="edit-item-category">Category *</label>
              <select id="edit-item-category" class="market-form-select" required>
                <option value="TEXTBOOK">📚 Textbooks & Notes</option>
                <option value="DRAFTER">📐 Mini Drafters & Kits</option>
                <option value="CALCULATOR">🔢 Calculators</option>
                <option value="LAB_COAT">🥼 Lab Coats & Aprons</option>
                <option value="ELECTRONICS">⚡ Dev Boards & Electronics</option>
                <option value="OTHER">📦 Other Academic Gear</option>
              </select>
            </div>

            <div class="market-form-group">
              <label class="market-form-label" for="edit-item-price">Price (₹ INR) *</label>
              <input type="number" id="edit-item-price" class="market-form-input" min="0" step="10" required />
            </div>
          </div>

          <div class="market-form-row">
            <div class="market-form-group">
              <label class="market-form-label" for="edit-item-condition">Condition *</label>
              <select id="edit-item-condition" class="market-form-select" required>
                <option value="Brand New">Brand New</option>
                <option value="Like New">Like New</option>
                <option value="Good Condition">Good Condition</option>
                <option value="Fair Condition">Fair Condition</option>
              </select>
            </div>

            <div class="market-form-group">
              <label class="market-form-label" for="edit-item-status">Listing Status</label>
              <select id="edit-item-status" class="market-form-select">
                <option value="AVAILABLE">Active (For Sale)</option>
                <option value="SOLD">Mark as Sold ✓</option>
              </select>
            </div>
          </div>

          <div class="market-form-group">
            <label class="market-form-label" for="edit-item-description">Description</label>
            <textarea id="edit-item-description" class="market-form-textarea" rows="3"></textarea>
          </div>
        </div>

        <div class="market-modal-footer">
          <button type="button" class="btn-modal-cancel" id="cancel-edit-modal">Cancel</button>
          <button type="submit" class="btn-modal-submit" id="btn-confirm-edit">Save Changes ✓</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
