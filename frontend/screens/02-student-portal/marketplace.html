<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace | Samskruti Digital Campus (Code: 259)</title>

  <!-- Neumorphic Base Styles -->
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/neumorphic-core.css" />
  <link rel="stylesheet" href="../../css/top-nav.css" />
  <link rel="stylesheet" href="../../css/animations.css" />
  <link rel="stylesheet" href="./marketplace.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="student-portal-body">
  <div class="portal-viewport-wrapper">
    
    <!-- 1. UNIVERSAL TOP FLOATING CAPSULE NAVIGATION -->
    <header class="top-nav-capsule-container">
      <nav class="capsule-nav" aria-label="Campus Connect Navigation">
        
        <!-- Brand / Institution Emblem -->
        <a href="dashboard.html" class="capsule-brand" title="Campus Connect">
          <div class="brand-emblem-badge">
            <img 
              src="/assets/images/samskruti-logo-blue.png" 
              alt="Campus Connect Logo" 
              class="brand-logo-img"
            />
          </div>
          <span class="brand-title">CAMPUS <span class="accent-text">CONNECT</span></span>
        </a>

        <div class="nav-divider"></div>

        <!-- Working Navigation Links -->
        <div class="capsule-menu-items">
          <a href="dashboard.html" class="nav-item" data-page="dashboard">
            <i data-lucide="layout-dashboard" class="nav-icon"></i>
            <span>Dashboard</span>
          </a>
          
          <a href="attendance.html" class="nav-item" data-page="attendance">
            <i data-lucide="calendar-check" class="nav-icon"></i>
            <span>Attendance</span>
          </a>

          <a href="results.html" class="nav-item" data-page="results">
            <i data-lucide="graduation-cap" class="nav-icon"></i>
            <span>Results</span>
          </a>

          <a href="idea-hub.html" class="nav-item" data-page="idea-hub">
            <i data-lucide="lightbulb" class="nav-icon"></i>
            <span>Idea Hub</span>
          </a>

          <a href="marketplace.html" class="nav-item active" data-page="marketplace">
            <i data-lucide="shopping-bag" class="nav-icon"></i>
            <span>Marketplace</span>
          </a>

          <a href="messages.html" class="nav-item" data-page="messages">
            <i data-lucide="message-square" class="nav-icon"></i>
            <span>Messages</span>
          </a>

          <a href="document-logistics.html" class="nav-item" data-page="document-logistics">
            <i data-lucide="file-text" class="nav-icon"></i>
            <span>Requests</span>
          </a>

          <a href="profile.html" class="nav-item" data-page="profile">
            <i data-lucide="user" class="nav-icon"></i>
            <span>Profile</span>
          </a>
        </div>

        <!-- Capsule Controls -->
        <div class="capsule-actions">
          <button id="theme-toggle-btn" class="util-btn" title="Toggle Theme" aria-label="Toggle Theme">
            <i data-lucide="sun" class="nav-icon"></i>
          </button>
          <a href="/screens/01-auth/login.html" class="util-btn logout" title="Sign Out" aria-label="Sign Out">
            <i data-lucide="log-out" class="nav-icon"></i>
          </a>
        </div>

      </nav>
    </header>

    <main class="main-content">
      
      <!-- Top Bar Header -->
      <header class="top-bar">
        <div class="welcome-text">
          <h1>Marketplace</h1>
          <p id="market-subtitle">Verified peer-to-peer campus exchange for textbooks, drafters, calculators & tech gear.</p>
        </div>
        <div class="top-bar-actions">
          <button class="neu-btn neu-btn-primary" id="btn-list-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            List Item
          </button>
        </div>
      </header>

      <!-- Category Filter Bar -->
      <section class="category-pills" id="category-filter-bar">
        <button class="neu-btn active" data-category="ALL">All Items</button>
        <button class="neu-btn" data-category="TEXTBOOK">Textbooks</button>
        <button class="neu-btn" data-category="DRAFTER">Mini Drafters</button>
        <button class="neu-btn" data-category="CALCULATOR">Calculators</button>
        <button class="neu-btn" data-category="LAB_GEAR">Lab Gear</button>
        <button class="neu-btn" data-category="TECH">Electronics & Tech</button>
      </section>

      <!-- Search Input -->
      <section class="search-section" style="margin-bottom: 20px;">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="market-search-input" class="neu-input" placeholder="Search marketplace by item title, author, or keyword..." />
        </div>
      </section>

      <!-- Dynamic Marketplace Items Grid -->
      <section class="marketplace-grid-section">
        <div class="surplus-grid" id="marketplace-grid">
          <!-- Dynamically populated from GET /api/marketplace/items or empty state -->
        </div>
      </section>

    </main>
  </div>

  <!-- =========================================================================
       MODAL 1: + LIST ITEM FOR SALE
       ========================================================================= -->
  <div class="neu-modal-overlay" id="list-item-modal" style="display: none;">
    <div class="neu-modal-card">
      <div class="modal-header">
        <h3>List Item for Sale</h3>
        <button class="modal-close-btn" id="close-list-modal">&times;</button>
      </div>
      
      <form id="list-item-form">
        <div class="modal-body">
          <div class="neu-input-group">
            <label class="neu-input-label" for="item-title">Item Title</label>
            <input type="text" id="item-title" class="neu-input" placeholder="e.g. Higher Engineering Math C-24 or Omega Drafter" required />
          </div>

          <div class="form-row">
            <div class="neu-input-group">
              <label class="neu-input-label" for="item-category">Category</label>
              <select id="item-category" class="neu-input" required>
                <option value="TEXTBOOK">Textbook / Manual</option>
                <option value="DRAFTER">Mini Drafter & Board</option>
                <option value="CALCULATOR">Scientific Calculator</option>
                <option value="LAB_GEAR">Lab Apron & Gear</option>
                <option value="TECH">Electronics / Dev Boards</option>
              </select>
            </div>

            <div class="neu-input-group">
              <label class="neu-input-label" for="item-price">Price (₹)</label>
              <input type="number" id="item-price" class="neu-input" placeholder="Price in ₹" min="0" step="10" required />
            </div>
          </div>

          <div class="neu-input-group">
            <label class="neu-input-label" for="item-condition">Physical Condition</label>
            <select id="item-condition" class="neu-input">
              <option value="Like New">Like New (Barely used)</option>
              <option value="Good Condition">Good Condition (No missing parts)</option>
              <option value="Fair Condition">Fair (Usable with minor wear)</option>
              <option value="Brand New">Brand New (Unopened)</option>
            </select>
          </div>

          <div class="neu-input-group">
            <label class="neu-input-label" for="item-description">Item Description & Notes</label>
            <textarea id="item-description" class="neu-input" rows="3" placeholder="Describe the item details, edition, included accessories, or preferred campus handover spot..."></textarea>
          </div>

          <!-- Photo Upload (Gallery & Camera) -->
          <div class="photo-upload-container" style="margin-top: 14px;">
            <label class="neu-input-label" style="text-transform: uppercase; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; display: block;">Product Images</label>
            <div class="upload-action-buttons" style="display: flex; gap: 10px; margin-bottom: 10px;">
              <!-- Gallery Upload Button -->
              <label for="gallery-input" class="upload-btn neumorphic-subtle" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: var(--shadow-raised); font-size: 0.82rem; font-weight: 700; color: var(--text-main); cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <span>Upload from Gallery</span>
                <input type="file" id="gallery-input" accept="image/*" class="hidden-input" style="display: none;" />
              </label>

              <!-- Direct Camera Capture Button -->
              <label for="camera-input" class="upload-btn neumorphic-subtle" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: var(--shadow-raised); font-size: 0.82rem; font-weight: 700; color: var(--text-main); cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <span>Take Photo (Camera)</span>
                <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden-input" style="display: none;" />
              </label>
            </div>

            <!-- Interactive Image Preview Box -->
            <div id="image-preview-wrapper" class="image-preview-wrapper" style="display: none; position: relative; width: 100%; height: 160px; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-inset); background: var(--bg-secondary); margin-top: 8px;">
              <img id="item-image-preview" src="" alt="Product Preview" style="width: 100%; height: 100%; object-fit: contain;" />
              <button type="button" id="btn-remove-image" class="remove-preview-btn" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, 0.65); color: #fff; border: none; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;" title="Remove Photo">✕</button>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="neu-btn" id="cancel-list-modal">Cancel</button>
          <button type="submit" class="neu-btn neu-btn-primary" id="publish-item-btn">Publish to Marketplace</button>
        </div>
      </form>
    </div>
  </div>

  <!-- =========================================================================
       MODAL 2: BUYER-SELLER IN-APP CHAT
       ========================================================================= -->
  <div class="neu-modal-overlay" id="seller-chat-modal" style="display: none;">
    <div class="neu-modal-card market-chat-modal-card">
      <div class="chat-modal-header">
        <div class="chat-peer-info">
          <div class="user-avatar" id="chat-seller-avatar">SS</div>
          <div>
            <h4 id="chat-seller-name">Seller Student</h4>
            <span class="chat-peer-sub" id="chat-item-context">Listing: Item Title (₹000)</span>
          </div>
        </div>
        <button class="modal-close-btn" id="close-seller-chat-modal">&times;</button>
      </div>

      <div class="chat-messages-container" id="seller-chat-messages">
        <!-- Messages rendered dynamically -->
      </div>

      <div class="chat-input-bar">
        <input type="text" id="seller-chat-input" class="neu-input" placeholder="Message seller regarding campus handover / pricing..." autocomplete="off" />
        <button type="button" class="neu-btn neu-btn-primary" id="send-seller-chat-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="../../js/top-nav.js"></script>
  <script type="module" src="./marketplace.js"></script>
</body>
</html>
