<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Security Credentials | Samskruti Digital Campus (Code: 259)</title>
  
  <!-- Base Neumorphic Styles -->
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/neumorphic.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="neu-card login-card" style="max-width: 480px; width: 100%;" data-active-tab="student">
      
      <!-- Header -->
      <div class="login-header">
        <div class="college-logo-container">
          <div class="college-logo-badge">SCET</div>
        </div>
        <h1 class="college-name">Password Reset & Identity Verification</h1>
        <p class="college-subtitle">Samskruti College of Engineering & Technology (Code: 259)</p>
      </div>

      <form id="reset-password-form" class="login-form">
        
        <!-- Email -->
        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-email">Registered Student Email</label>
          <div class="neu-input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="reset-email"
              class="neu-input"
              placeholder="Enter registered email address"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Diploma PIN -->
        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-pin">Diploma PIN No</label>
          <div class="neu-input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2" ry="2"/>
              <line x1="7" y1="8" x2="17" y2="8"/>
              <line x1="7" y1="12" x2="13" y2="12"/>
              <circle cx="16" cy="14" r="2"/>
            </svg>
            <input
              type="text"
              id="reset-pin"
              class="neu-input"
              placeholder="Diploma PIN (e.g. 24259-CS-025)"
              required
              style="text-transform: uppercase;"
            />
          </div>
        </div>

        <!-- Institutional Security Key -->
        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-secret">Institutional Security Key</label>
          <div class="neu-input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <input
              type="text"
              id="reset-secret"
              class="neu-input"
              placeholder="Security Key (STD-XXXXXX)"
              required
              style="text-transform: uppercase; font-family: monospace;"
            />
          </div>
        </div>

        <!-- New Password -->
        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-new-password">New Password</label>
          <div class="neu-input-wrapper password-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="reset-new-password"
              class="neu-input"
              placeholder="Minimum 8 characters"
              required
              minlength="8"
            />
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="reset-submit-btn">
          <span>Reset Password & Proceed to Login →</span>
        </button>

        <div style="text-align: center; margin-top: 14px;">
          <a href="./login.html?tab=signin" style="font-size: 0.84rem; color: var(--text-muted); text-decoration: none; font-weight: 600;">
            ← Back to Student Sign In
          </a>
        </div>
      </form>

    </div>
  </div>

  <script type="module" src="./forgot-password.js"></script>
</body>
</html>
