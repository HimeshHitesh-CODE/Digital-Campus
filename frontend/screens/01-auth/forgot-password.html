<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Security Credentials | Samskruti Digital Campus</title>
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/neumorphic.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="neu-card login-card" style="max-width: 480px; width: 100%;">
      
      <div class="login-header">
        <div class="college-logo-container">
          <div class="college-logo-badge">SCET</div>
        </div>
        <h1 class="college-name">Password Reset & Identity Verification</h1>
        <p class="college-subtitle">Samskruti College of Engineering & Technology (Code: 259)</p>
      </div>

      <form id="reset-password-form" class="login-form">
        
        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-email">Registered Student Email</label>
          <input type="email" id="reset-email" class="neu-input" placeholder="Registered Student Email" required />
        </div>

        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-pin">Diploma PIN No</label>
          <input type="text" id="reset-pin" class="neu-input" placeholder="Diploma PIN (24259-XX-XXX)" required style="text-transform: uppercase;" />
        </div>

        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-secret">Institutional Security Key</label>
          <input type="text" id="reset-secret" class="neu-input" placeholder="Security Key (STD-XXXXXX)" required style="text-transform: uppercase; font-family: monospace;" />
        </div>

        <div class="neu-input-group">
          <label class="neu-input-label" for="reset-new-password">New Password</label>
          <input type="password" id="reset-new-password" class="neu-input" placeholder="Minimum 8 characters" required />
        </div>

        <button type="submit" class="neu-btn neu-btn-primary submit-btn" id="reset-submit-btn">
          <span>Reset Password & Proceed to Login →</span>
        </button>

        <div style="text-align: center; margin-top: 14px;">
          <a href="./login.html" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none;">
            ← Back to Student Sign In
          </a>
        </div>
      </form>

    </div>
  </div>

  <script type="module" src="./forgot-password.js"></script>
</body>
</html>
